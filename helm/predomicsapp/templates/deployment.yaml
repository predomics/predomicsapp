{{- include "predomicsapp.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "predomicsapp.fullname" . }}
  labels:
    {{- include "predomicsapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The data volume is ReadWriteOnce and the app is single-instance: stop the
  # old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "predomicsapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.service.targetPort | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "predomicsapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - sh
            - -c
            # -U and -d are given explicitly: this container runs as a uid with no
            # passwd entry, and pg_isready refuses to guess a user name then.
            - until pg_isready -h {{ include "predomicsapp.postgresqlName" . }} -p 5432 -U {{ .Values.postgresql.auth.username | quote }} -d {{ .Values.postgresql.auth.database | quote }} -q; do echo "waiting for postgresql"; sleep 2; done
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "predomicsapp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "predomicsapp.fullname" . }}
          env:
            - name: HOME
              value: /tmp
            - name: PREDOMICS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "predomicsapp.secretName" . }}
                  key: secret-key
            {{- if or .Values.secrets.metricsToken .Values.secrets.existingSecret }}
            - name: PREDOMICS_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "predomicsapp.secretName" . }}
                  key: metrics-token
                  optional: true
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "predomicsapp.secretName" . }}
                  key: postgres-password
            # $(POSTGRES_PASSWORD) is expanded by Kubernetes. A password set by
            # hand must be URL-safe (letters and digits).
            - name: PREDOMICS_DATABASE_URL
              value: {{ printf "postgresql+asyncpg://%s:$(POSTGRES_PASSWORD)@%s:5432/%s" .Values.postgresql.auth.username (include "predomicsapp.postgresqlName" .) .Values.postgresql.auth.database | quote }}
            {{- else }}
            - name: PREDOMICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "predomicsapp.secretName" . }}
                  key: database-url
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "predomicsapp.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
