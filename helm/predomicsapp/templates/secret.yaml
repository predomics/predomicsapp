{{- if not .Values.secrets.existingSecret -}}
{{- /*
Generated values are created once and then read back from the cluster, so
`helm upgrade` does not rotate the JWT key (which would log everyone out) or the
database password (which would lock the app out of PostgreSQL).
*/ -}}
{{- $name := include "predomicsapp.fullname" . -}}
{{- $data := dict -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $secretKey := "" -}}
{{- if .Values.secrets.secretKey -}}
{{- $secretKey = .Values.secrets.secretKey | b64enc -}}
{{- else if hasKey $data "secret-key" -}}
{{- $secretKey = index $data "secret-key" -}}
{{- else -}}
{{- $secretKey = randAlphaNum 64 | b64enc -}}
{{- end -}}
{{- $pgPassword := "" -}}
{{- if .Values.secrets.postgresPassword -}}
{{- $pgPassword = .Values.secrets.postgresPassword | b64enc -}}
{{- else if hasKey $data "postgres-password" -}}
{{- $pgPassword = index $data "postgres-password" -}}
{{- else -}}
{{- $pgPassword = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "predomicsapp.labels" . | nindent 4 }}
  annotations:
    # Kept on `helm uninstall`: the data volumes outlive the release and are
    # useless without these values.
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ $secretKey | quote }}
  {{- if .Values.secrets.metricsToken }}
  metrics-token: {{ .Values.secrets.metricsToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ $pgPassword | quote }}
  {{- else if .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
