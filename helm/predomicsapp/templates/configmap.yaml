apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "predomicsapp.fullname" . }}
  labels:
    {{- include "predomicsapp.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- $publicUrl := include "predomicsapp.publicUrl" . }}
  {{- if $publicUrl }}
  {{- if not (hasKey .Values.env "PREDOMICS_FRONTEND_URL") }}
  PREDOMICS_FRONTEND_URL: {{ $publicUrl | quote }}
  {{- end }}
  {{- if not (hasKey .Values.env "PREDOMICS_CORS_ORIGINS") }}
  PREDOMICS_CORS_ORIGINS: {{ list $publicUrl | toJson | quote }}
  {{- end }}
  {{- end }}
