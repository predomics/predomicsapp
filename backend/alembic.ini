# Alembic configuration for PredomicsApp.
#
# Normal use goes through the application:   python -m backend.app.migrate
# (it also upgrades databases that predate Alembic). Direct use, from the
# repository or image root:                  alembic -c backend/alembic.ini current
#
# The database URL is not stored here: env.py takes it from PREDOMICS_DATABASE_URL.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s: %(message)s
