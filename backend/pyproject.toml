[project]
name = "predomicsapp-backend"
# Single source of truth for the application version: keep equal to the git
# tag (vX.Y.Z) and to appVersion in helm/predomicsapp/Chart.yaml (CI checks it).
version = "2.2.0"
description = "FastAPI backend for PredomicsApp — web interface for gpredomics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0",
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "slowapi>=0.1.9",
    "reportlab>=4.0",
    "networkx>=3.0",
    "scikit-learn>=1.0",
    "umap-learn>=0.5",
    "alembic>=1.13",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
email = ["aiosmtplib>=2.0"]
scitq = ["scitq>=1.0"]
# Error tracking: only used when PREDOMICS_SENTRY_DSN is set. Not in the image by default.
sentry = ["sentry-sdk>=2.0"]
# xgboost-cpu provides the same `xgboost` module without the GPU libraries.
ml = ["xgboost-cpu>=3.0", "lightgbm>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.25",
    "aiosqlite>=0.19",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/main.py", "app/services/worker.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__"]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: style, F: pyflakes (unused names, redefinitions such as duplicate test
# classes), B: likely bugs, ASYNC: blocking calls inside async functions.
select = ["E", "W", "F", "B", "ASYNC"]
ignore = ["E501"]
