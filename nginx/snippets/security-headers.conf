# Security headers. Included at server level AND in every location that uses
# add_header itself (nginx drops inherited add_header directives there).
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS: $predomics_hsts is set by the HTTPS template and empty in HTTP mode
# (nginx does not emit a header whose value is empty).
add_header Strict-Transport-Security $predomics_hsts always;
# Content Security Policy (enforced). Scripts, styles, fonts and connections are
# limited to this origin; inline styles are allowed because the charting library
# positions elements with style attributes. See DEPLOYMENT.md "Content Security
# Policy" before loosening it. tests/e2e checks the app against this exact line.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
