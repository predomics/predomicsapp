# Shared proxy locations (included by nginx/https and nginx/http templates).

# The upstream is resolved at request time through Docker's embedded DNS, so
# nginx starts even when the app container is not up yet (first-time SSL setup)
# and follows the app when its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
set $predomics_app http://app:8000;

# The application sets a baseline of these headers itself (for deployments
# without a proxy). Here nginx is the single source: drop the upstream copies so
# browsers never see two different values.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;

# Client address passed to the application (rate limiting, audit log).
# $remote_addr is the peer that connected to nginx, or — when that peer is a
# proxy listed in NGINX_TRUSTED_PROXY — the client it reports. Whatever
# X-Forwarded-For the browser sent is discarded: forwarding it would let anyone
# pick their own address and escape the login rate limit.
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $predomics_forwarded_proto;

# Liveness of nginx itself (used by the compose healthcheck)
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Application (API, SPA)
location / {
    proxy_pass $predomics_app;
}

# WebSocket (job progress streaming). The query string carries a credential,
# so it is kept out of the access log.
location /ws/ {
    proxy_pass $predomics_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $predomics_forwarded_proto;
    proxy_read_timeout 3600s;
    access_log /var/log/nginx/access.log predomics_noargs;
}

# Static assets — long cache (file names are content-hashed)
location /assets/ {
    proxy_pass $predomics_app;
    add_header Cache-Control "public, max-age=604800, immutable";
    # add_header here hides the server-level ones: include them again.
    include /etc/nginx/predomics/security-headers.conf;
}

# Prometheus metrics are for the monitoring system inside the deployment
# (scrape the app container directly, with PREDOMICS_METRICS_TOKEN). Never
# served to the outside.
location = /metrics {
    return 404;
}

# Health checks — no logging
location = /health {
    proxy_pass $predomics_app;
    access_log off;
}
location = /health/ready {
    proxy_pass $predomics_app;
    access_log off;
}
