# Development stack: hot-reload backend + Vite dev server + PostgreSQL.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#     frontend (hot reload)  http://localhost:5173
#     backend API + docs     http://localhost:8000/api/docs
#     PostgreSQL             localhost:5432  (predomics / predomics)
#
# Tests (see CONTRIBUTING.md):
#   docker compose -f docker-compose.dev.yml run --rm backend-test
#   docker compose -f docker-compose.dev.yml run --rm frontend-test
#
# The backend image is the `dev` stage of the Dockerfile (runtime + pytest/ruff);
# the first build compiles the Rust engine (10-25 minutes).
# Host ports can be changed with DEV_BACKEND_PORT, DEV_FRONTEND_PORT, DEV_DB_PORT.
name: predomics-dev

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  target: dev
  args:
    - GPREDOMICS_REF=${GPREDOMICS_REF:-acc2a6bf08b140b6bac356cb8797e2141d0f98cc}
    - GPREDOMICSPY_REF=${GPREDOMICSPY_REF:-d963ec310be71afc7f9517084d6a348450160029}

services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: predomics-dev-db
    environment:
      POSTGRES_USER: predomics
      POSTGRES_PASSWORD: predomics
      POSTGRES_DB: predomics
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predomics -d predomics"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: predomics-dev-backend
    image: predomics-app:dev
    build: *backend-build
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./samples:/app/samples
    environment:
      - PREDOMICS_DEBUG=true
      - PREDOMICS_DATA_DIR=/app/data
      - PREDOMICS_UPLOAD_DIR=/app/data/uploads
      - PREDOMICS_PROJECT_DIR=/app/data/projects
      - PREDOMICS_SAMPLES_DIR=/app/samples
      - PREDOMICS_DATABASE_URL=postgresql+asyncpg://predomics:predomics@db:5432/predomics
      - PREDOMICS_SECRET_KEY=dev-secret-key
      - PREDOMICS_CORS_ORIGINS=["http://localhost:${DEV_FRONTEND_PORT:-5173}","http://localhost:3000"]
      - PREDOMICS_FRONTEND_URL=http://localhost:${DEV_FRONTEND_PORT:-5173}
      # Development conveniences — never use these in production.
      - PREDOMICS_SEED_DEMO=true
      - PREDOMICS_ADMIN_EMAIL=${PREDOMICS_ADMIN_EMAIL:-}
      # Bind-mounted source and data belong to the host user: do not chown them.
      - PREDOMICS_RUN_AS=root
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: predomics-dev-frontend
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /app
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keep Linux node_modules out of the host tree.
      - frontend-node-modules:/app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:8000
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host"
    depends_on:
      - backend

  # --- test runners (not started by `up`) -----------------------------------
  backend-test:
    profiles: ["test"]
    image: predomics-app:dev
    build: *backend-build
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./samples:/app/samples:ro
    environment:
      - PYTHONPATH=.
      - PYTHONDONTWRITEBYTECODE=1
      - PREDOMICS_RUN_AS=root
    # SQLite in a temp dir (see backend/tests/conftest.py); no database needed.
    command: python -m pytest tests/ -q -p no:cacheprovider

  frontend-test:
    profiles: ["test"]
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx vitest run"

volumes:
  pgdata:
  frontend-node-modules:
